{% extends 'base.html' %}

{% block title %}Eliminar Publicación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-4 border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
                <h3 class="card-title fw-bold">¿Confirmas la eliminación?</h3>
                <p class="text-secondary mt-2">
                    Estás a punto de eliminar permanentemente la publicación:
                </p>
                <div class="alert alert-light border fw-semibold text-break">
                    "{{ object.title }}"
                </div>
                <p class="text-danger small">Esta acción no se puede deshacer.</p>

                <form method="POST" class="mt-4 d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary px-4">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i>Sí, Eliminar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
